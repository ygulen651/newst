<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThermaPlus Isı Pompası Kapasite Simülatörü</title>
<!--
==================================================================================
  THERMAPLUS ISI POMPASI KAPASİTE SİMÜLATÖRÜ  ·  v3
  Tek dosya, kurulum gerektirmez. Logo dosyanın içine gömülüdür.

  KAPSAM
    Yapı türleri : Müstakil ev, apartman dairesi, otel, fabrika/depo,
                   mağaza/ofis, havuz, sera
    Amaç         : Isıtma / Soğutma / Kullanım sıcak suyu (çoklu seçim)
    Tesisat      : Sıfırdan kurulum veya mevcut tesisata entegrasyon
                   (mevcut radyatör ve yerden ısıtma yeterlilik kontrolü)

  HESAP YÖNTEMİ  (tüm katsayılar aşağıdaki CFG bloğunda)
    Isıtma yükü   Q = (Qtransmisyon + Qhavalandırma) × emniyet payı
                  Qtrans = Alan × qYalıtım × fKonum × fCam × fKat × ΔT
                  Qhava  = 0,34 × Hacim × HavaDeğişimi × ΔT
                  ΔT = İç tasarım sıcaklığı − Kış tasarım dış sıcaklığı
    Soğutma yükü  Q = Alan × qSoğutma × fCam × (YazTasarım − 26) / 9
    Sıcak su      Günlük litre × 35 K × 1,163 Wh/L·K ; kapasite = günlük / 3 saat
    Havuz         Yüzey alanı × qHavuz (örtü ve konum durumuna göre)
    Sera          Örtü alanı (taban × 1,8) × U × ΔT
    SCOP          Gidiş suyu sıcaklığı ve iklim bölgesine göre tablo
    Yıllık tüketim = Kapasite × eşdeğer tam yük saati / SCOP

  MEVCUT TESİSAT KONTROLÜ
    Radyatör kapasitesi = Uzunluk × 1400 W/m × (Yükseklik/0,6)
                          × (ΔTlog / 50)^1,3
    Yerden ısıtma       = Boru uzunluğu × 14 W/m  (20 cm boru aralığı, 35 °C)
    Hesaplanan yük tesisatın kapasitesini aşarsa kullanıcı uyarılır.

  ÜRÜNLER  (newstag-sigma.vercel.app/isi-pompasi)
    Up 8-35 kW · Boost 8-22 kW (R290, yüksek sıcaklık) · All 200/300 L
    Silent Pool 10-33 kW · Commercial Pool 26-145 kW · Commercial Duo 50/92 kW
    92 kW üstü kaskad. MAX_KW üzerinde ürün önerilmez, proje çalışmasına yönlendirilir.

  E-POSTA
    Sonuçlar MAIL_TO adresine FormSubmit ile gider. İlk gönderimde bu adrese
    bir doğrulama maili düşer; linke bir kez tıklandıktan sonra sistem aktiftir.
    Servis yanıt vermezse form yedek olarak posta programını açar.
==================================================================================
-->
<style>
  :root{
    --navy:#16326B; --navy-deep:#0E2049; --flame:#E23D19; --azure:#0B79C4;
    --paper:#FBFAF8; --line:#E3E0DA; --ink:#1C1F26; --muted:#6B7280;
    --amber:#B26A00; --amber-bg:#FFF6E6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:32px 20px 64px;
  }
  .shell{width:100%;max-width:760px}

  header.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  header.brand img{width:190px;height:auto;display:block;mix-blend-mode:multiply}
  header.brand p{margin:0;font-size:13px;color:var(--muted);text-align:right;max-width:230px}
  .brand-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .site-back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);padding:9px 15px;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 8px 22px rgba(14,32,73,.06)}
  .site-back:hover{border-color:var(--navy);background:var(--navy);color:#fff}

  .rail{display:flex;gap:5px;margin:22px 0 28px}
  .rail span{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .25s}
  .rail span.on{background:var(--navy)}
  .rail span.done{background:var(--azure)}

  .count{font-size:13px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
  h1{font-size:clamp(25px,4.2vw,33px);line-height:1.2;font-weight:700;color:var(--navy-deep);margin:0 0 8px;letter-spacing:-.015em;max-width:26ch}
  .lead{margin:0 0 26px;color:var(--muted);font-size:15px;max-width:62ch}
  h2.q{font-size:21px;font-weight:600;color:var(--navy-deep);margin:0 0 6px;line-height:1.35;letter-spacing:-.01em}
  .hint{font-size:14px;color:var(--muted);margin:0 0 18px;max-width:60ch}

  /* kart ızgarası */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 14px;cursor:pointer;text-align:left;transition:border-color .15s}
  .card:hover{border-color:#C9C4BA}
  .card.sel{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--flame)}
  .card b{display:block;font-weight:600;font-size:16px;color:var(--navy-deep);margin-bottom:2px}
  .card i{font-style:normal;font-size:13px;color:var(--muted);line-height:1.4;display:block}

  /* alan ızgarası */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
  .fld{margin-bottom:4px}
  input[type=text],input[type=number],input[type=tel],input[type=email],textarea,select{
    width:100%;padding:12px 13px;font:inherit;font-size:17px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--azure);box-shadow:0 0 0 3px rgba(11,121,196,.16)}
  textarea{min-height:100px;resize:vertical}
  .fld .u{font-size:13px;color:var(--muted);margin-top:4px;display:block}

  nav{display:flex;align-items:center;gap:14px;margin-top:30px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent}
  .next{background:var(--navy);color:#fff;padding:12px 30px;font-weight:600;font-size:17px}
  .next:hover{background:var(--navy-deep)}
  .send{background:var(--flame);color:#fff;padding:12px 30px;font-weight:600;font-size:17px}
  .send:hover{background:#C7330F}
  .back{background:none;color:var(--muted);padding:12px 4px;border:none;text-decoration:underline}
  button:disabled{opacity:.55;cursor:default}
  button:focus-visible,.card:focus-visible,a:focus-visible{outline:2px solid var(--azure);outline-offset:2px}

  .err{color:var(--flame);font-size:14.5px;margin-top:12px;display:none}
  .err.show{display:block}

  /* sonuç */
  .figures{border-top:2px solid var(--navy);margin:0 0 24px}
  .fig{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
  .fig .name{font-size:15px;color:var(--muted);max-width:34ch}
  .fig .val{font-size:28px;font-weight:700;color:var(--navy-deep);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
  .fig .val u{text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);margin-left:5px}
  .fig.lead-fig .val{color:var(--flame);font-size:37px}

  .pick{background:#fff;border:1px solid var(--line);border-left:4px solid var(--flame);border-radius:8px;padding:18px 20px;margin-bottom:14px}
  .pick h3{margin:0 0 10px;font-size:19px;color:var(--navy-deep);letter-spacing:-.01em}
  .pick .item{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
  .pick .item b{font-weight:600;color:var(--navy-deep)}
  .pick .item span{color:var(--muted);font-size:14px;text-align:right;max-width:26ch}
  .pick a{display:inline-block;margin-top:12px;font-size:14.5px}

  .warn{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:8px;padding:14px 18px;margin-bottom:12px;font-size:14.5px;color:#5A3A00}
  .warn b{display:block;color:var(--amber);margin-bottom:3px}
  .note{background:#F2F5FA;border-radius:8px;padding:15px 18px;font-size:14.5px;color:#33405C}

  .done-box{text-align:center;padding:40px 10px}
  .done-box h2{color:var(--navy-deep);font-size:27px;margin:0 0 10px;letter-spacing:-.015em}
  .done-box p{color:var(--muted);margin:0 auto 22px;max-width:46ch}
  .tick{width:56px;height:56px;border-radius:50%;background:var(--azure);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
  .again{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 24px;font-weight:600}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  a{color:var(--azure)}

  @media (max-width:560px){
    body{padding:20px 16px 48px}
    .grid{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr 1fr}
    header.brand{flex-direction:column;align-items:flex-start;gap:10px}
    header.brand p{text-align:left}
    .brand-actions{align-items:flex-start}
    .fig{flex-direction:column;gap:2px}
    .fig .val{font-size:26px}
    .fig.lead-fig .val{font-size:32px}
    .pick .item{flex-direction:column;gap:2px}
    .pick .item span{text-align:left;max-width:none}
  }
</style>
</head>

/* ================================================================
   3) HESAP MOTORU
   ================================================================ */
function num(k, d){ var v = parseFloat(A[k]); return isNaN(v) ? d : v; }

function scopAt(t, zoneF){
  var keys = Object.keys(CFG.scop).map(Number).sort(function(a,b){return a-b;});
  var lo = keys[0], hi = keys[keys.length-1];
  if(t <= lo) return CFG.scop[lo] * zoneF;
  if(t >= hi) return CFG.scop[hi] * zoneF;
  for(var i=0;i<keys.length-1;i++){
    if(t >= keys[i] && t <= keys[i+1]){
      var a=keys[i], b=keys[i+1], r=(t-a)/(b-a);
      return (CFG.scop[a] + (CFG.scop[b]-CFG.scop[a])*r) * zoneF;
    }
  }
  return CFG.scop[45] * zoneF;
}

/* logaritmik sıcaklık farkına göre radyatör derating */
function radDerate(flowT, ti){
  var ret = flowT - 8;                               // 8 K su tarafı sıcaklık düşümü
  var dt  = ((flowT - ti) - (ret - ti)) / Math.log((flowT - ti) / (ret - ti));
  return Math.pow(dt / 50, 1.3);
}

function pickSize(series, need){
  var s = series.sizes.filter(function(x){ return x >= need; });
  return s.length ? s[0] : null;
}

function compute(){
  var z  = CFG.zones[A.zone];
  var s  = seg();
  var warns = [], out = {};

  /* ---------- HAVUZ ---------- */
  if(s === 'havuz'){
    var pa = num('area', 32);
    var pq = CFG.pool[A.pooltype].q;
    out.heat = Math.round(pa * pq / 1000 * MARGIN * 10)/10;
    out.flowT = 40;
    out.scop  = 4.0 * z.copF;
    out.energyH = Math.round(out.heat * z.eflhH * 0.6 / out.scop);
    var pser = out.heat <= 33 ? SERIES.spool : SERIES.cpool;
    var psz  = pickSize(pser, out.heat);
    out.units = psz ? [{s:pser, size:psz, role:'Havuz ısıtma'}]
                    : cascade(SERIES.cpool, out.heat, 'Havuz ısıtma', warns);
    warns.push(['Havuz hacmi', 'İlk ısıtma süresi havuz hacmine bağlıdır; ' + Math.round(pa*num('depth',1.5)) + ' m³ hacim için devreye alma planını mühendislik ekibimizle belirleyin.']);
  }

  /* ---------- SERA ---------- */
  else if(s === 'sera'){
    var sa = num('area', 1000);
    var su = CFG.cover[A.cover].u;
    var sti = num('seraT', CFG.seraTi);
    var sdt = sti - z.tw;
    out.heat = Math.round(sa * CFG.seraSurface * su * sdt / 1000 * MARGIN * 10)/10;
    out.flowT = 45;
    out.scop  = scopAt(45, z.copF);
    out.energyH = Math.round(out.heat * z.eflhH / out.scop);
    out.units = pickSize(SERIES.duo, out.heat)
      ? [{s:SERIES.duo, size:pickSize(SERIES.duo, out.heat), role:'Sera ısıtma'}]
      : cascade(SERIES.duo, out.heat, 'Sera ısıtma', warns);
    warns.push(['Sera projeleri', 'Perde sistemi, rüzgâr yükü ve gece örtüsü kullanımı bu değeri belirgin şekilde değiştirir. Sera projelerinde mutlaka yerinde keşif yapılır.']);
  }

  /* ---------- BİNA ---------- */
  else {
    var t   = CFG.types[A.btype];
    var ar  = num('area', 100), hh = num('height',3), nf = num('nfloor',2), pp = num('people',4);
    var vol = ar * hh;
    var qi  = CFG.insul[A.insul].q, gf = CFG.glass[A.glass].f, ff = CFG.facade[A.facade].f;

    /* ısıtma */
    if(has('isitma')){
      var dT = t.ti - z.tw;
      var qTrans = ar * qi * t.pos * gf * ff * CFG.floors(nf) * dT / 1000;
      var qVent  = 0.34 * vol * t.ach * dT / 1000;

      /* seçilen ısıtıcıların en yükseği kapasite faktörünü belirler */
      var ef = 1.0, ft = 35;
      A.emit.forEach(function(k){
        ef = Math.max(ef, CFG.emitters[k].f);
        ft = Math.max(ft, CFG.emitters[k].temp);
      });
      if(A.install === 'mevcut') ft = num('flowT', ft);

      out.heat = (qTrans + qVent) * ef * MARGIN;
      out.qTrans = Math.round(qTrans*10)/10;
      out.qVent  = Math.round(qVent*10)/10;

      if(A.hybrid === 'evet'){
        out.fullHeat = Math.round(out.heat*10)/10;
        out.heat = out.heat * 0.70;
        out.hybridShare = 0.85;
        warns.push(['Mevcut sisteminiz yedekte kalıyor',
          'Isı pompası ' + fmt(Math.round(out.heat*10)/10) + ' kW seçildi; binanın en soğuk gündeki toplam ihtiyacı ' + fmt(out.fullHeat) + ' kW. Aradaki farkı yılın yalnızca en soğuk birkaç gününde mevcut ' + CFG.sources[A.source].v.toLowerCase() + ' sisteminiz tamamlar. Yıllık ısıtmanın yaklaşık %85\'i yine ısı pompasından gelir, cihaz bir üst modele çıkmadığı için ilk yatırım belirgin şekilde düşer.']);
      }
      out.heat  = Math.round(out.heat*10)/10;
      out.flowT = ft;
      out.scop  = Math.round(scopAt(ft, z.copF)*100)/100;
      out.energyH = Math.round(out.heat * z.eflhH / out.scop);

      /* mevcut tesisat yeterlilik kontrolü */
      if(A.install === 'mevcut'){
        var panelKey = A.emit.indexOf('dosemefc')>-1 ? 'dosemefc' : (A.emit.indexOf('radyator')>-1 ? 'radyator' : null);
        if(panelKey && num('radLen',0) > 0){
          var pk = CFG.emitters[panelKey].panelK;
          var radCap = num('radLen',0) * 1400 * (num('radH',0.6)/0.6) * radDerate(ft, t.ti) * pk / 1000;
          out.radCap = Math.round(radCap*10)/10;
          var isFC = panelKey === 'dosemefc';
          var yuzey = isFC ? 'fan-coil yüzeyi' : 'radyatör yüzeyi';
          if(radCap < out.heat){
            warns.push([
              (isFC ? 'Fan-coil yüzeyi yetersiz' : 'Radyatör yüzeyi yetersiz'),
              isFC
                ? 'Belirttiğiniz uzunluktaki döşeme tipi fan-coil ' + ft + ' °C gidiş suyunda yaklaşık ' + fmt(out.radCap) + ' kW verebilir; ihtiyaç ' + fmt(out.heat) + ' kW. Ünite sayısını artırmak veya daha uzun/yüksek modeller seçmek gerekir. Mahal bazında dağılımı mühendislik ekibimizle netleştirin.'
                : 'Mevcut radyatörleriniz ' + ft + ' °C gidiş suyunda yaklaşık ' + fmt(out.radCap) + ' kW verebilir; ihtiyaç ' + fmt(out.heat) + ' kW. Suyu daha sıcak vermek verimi ve tasarrufu düşürür. Bunun yerine peteklerin yerine döşeme tipi fan-coil (üflemeli petek) takmak en ekonomik çözümdür: aynı ölçüdeki yüzey, fan desteğiyle iki katından fazla ısı verir, 45 °C su ile çalışır ve yazın soğutma da yapar.'
            ]);
          } else {
            warns.push([
              (isFC ? 'Fan-coil yüzeyi yeterli' : 'Radyatör yüzeyi yeterli'),
              'Belirttiğiniz ' + yuzey + ' ' + ft + ' °C gidiş suyunda yaklaşık ' + fmt(out.radCap) + ' kW verebiliyor; ihtiyacı karşılıyor. Gidiş sıcaklığını düşürerek verimi daha da artırabilirsiniz.'
            ]);
          }
        }
        if(A.emit.indexOf('yerden')>-1 && num('pipeLen',0) > 0){
          var flrCap = num('pipeLen',0) * 14 / 1000;
          out.flrCap = Math.round(flrCap*10)/10;
          if(flrCap < out.heat * 0.9)
            warns.push(['Yerden ısıtma devresi sınırda','Mevcut boru uzunluğu yaklaşık ' + fmt(out.flrCap) + ' kW taşıyabilir; ihtiyaç ' + fmt(out.heat) + ' kW. Eksik kalan yük için ilave devre veya destekleyici fan-coil değerlendirilmelidir.']);
        }
      }
    }

    /* soğutma */
    if(has('sogutma')){
      out.cool = Math.round(ar * t.qCool * gf * Math.min(1.25, Math.max(0.7,(z.ts-26)/9)) / 1000 * MARGIN * 10)/10;
      out.energyC = Math.round(out.cool * z.eflhC / CFG.seer);
    }

    /* kullanım sıcak suyu */
    if(has('sicaksu')){
      var lit = pp * t.dhwL;
      var eDay = lit * 35 * 1.163 / 1000;                 // kWh/gün
      out.dhwL = lit;
      var chg = (seg()==='konut') ? DHW_CHARGE_H : DHW_CHARGE_H_TIC;
      out.dhwKW = Math.round(eDay / chg * 10)/10;
      out.dhwTank = Math.round(lit * 1.2 / 50) * 50;
      out.energyD = Math.round(eDay * 365 / CFG.copDHW);
    }

    /* soğutma yüzeyi kontrolü */
    if(has('sogutma') && A.emit.length){
      var canCool = A.emit.some(function(k){ return CFG.emitters[k].cool; });
      if(!canCool)
        warns.push(['Soğutma için uygun yüzey yok','Seçtiğiniz yüzeyler yalnızca ısıtma yapar. Soğutma da isteniyorsa en az bir mahalde fan-coil gerekir — döşeme tipi veya kaset tipi olabilir. Klasik panel radyatör ve yerden ısıtma soğuk suyla yoğuşma yaptığı için soğutmada kullanılamaz.']);
    }

    /* mevcut sistemle işletme maliyeti karşılaştırması */
    if(has('isitma') && A.source && A.source !== 'yok'){
      var src = CFG.sources[A.source];
      var unitPrice = PRICES[A.source];
      if(unitPrice > 0){
        var heatNeed = (out.fullHeat || out.heat) * z.eflhH;          // kWh ısı / yıl
        var costOld  = heatNeed / (src.kwh * src.eff) * unitPrice;
        var hpElec   = heatNeed / out.scop;
        var costNew  = hpElec * PRICES.elektrik;
        if(A.hybrid === 'evet'){
          var share = out.hybridShare || 0.85;
          costNew = (heatNeed * share / out.scop) * PRICES.elektrik +
                    (heatNeed * (1-share) / (src.kwh * src.eff)) * unitPrice;
        }
        out.costOld = Math.round(costOld);
        out.costNew = Math.round(costNew);
        out.saving  = Math.round(costOld - costNew);
        out.savingPct = costOld > 0 ? Math.round((1 - costNew/costOld)*100) : 0;
        out.srcName = src.v;
      }
    }

    /* ana cihaz kapasitesi */
    var main = Math.max(out.heat || 0, out.cool || 0);
    out.main = Math.round(main*10)/10;

    /* ürün seçimi */
    out.units = [];
    if(main > 0){
      var highT = (out.flowT || 45) > SERIES.up.maxTemp - 5;   // 55 °C ve üstü → Boost
      var prim  = highT ? SERIES.boost : SERIES.up;
      var sz    = pickSize(prim, main);
      if(!sz && highT) { prim = SERIES.up; sz = pickSize(prim, main); }
      if(sz){
        out.units.push({s:prim, size:sz, role: has('sogutma') ? 'Isıtma + soğutma' : 'Isıtma'});
      } else {
        var dsz = pickSize(SERIES.duo, main);
        if(dsz) out.units.push({s:SERIES.duo, size:dsz, role:'Isıtma / soğutma'});
        else out.units = out.units.concat(cascade(SERIES.duo, main, 'Isıtma / soğutma', warns));
      }
    }

    /* sıcak su ünitesi */
    if(has('sicaksu')){
      if(seg()==='konut' && out.dhwTank <= 300){
        out.units.push({s:SERIES.all, size:(out.dhwTank<=200?200:300), unit:'L', role:'Kullanım sıcak suyu'});
      } else {
        out.units.push({s:SERIES.duo, size:pickSize(SERIES.duo, out.dhwKW) || 50,
                        role:'Merkezi sıcak su (' + fmt(out.dhwTank) + ' L akümülasyon tankı ile)'});
      }
    }

    /* elektrik uyarısı */
    if(A.elec === '220' && main > 16)
      warns.push(['Trifaze besleme gerekli','Hesaplanan ' + fmt(out.main) + ' kW kapasite monofaze 220 V ile beslenemez. Bu proje için 380 V trifaze abonelik veya güç artırımı gerekir.']);

    if(seg()==='ticari')
      warns.push(['Ticari proje','Ticari yapılarda proses yükü, çalışma saatleri, iç kazançlar ve havalandırma debisi sonucu belirgin şekilde değiştirir. Bu değer ön boyutlandırmadır; kesin seçim keşif sonrası yapılır.']);
  }

  out.energy = (out.energyH||0) + (out.energyC||0) + (out.energyD||0);
  out.warns = warns;
  out.zone  = z;
  R = out;
}

function cascade(series, need, role, warns){
  if(need > MAX_KW){
    warns.push(['Yüksek kapasiteli proje',
      'Hesaplanan ' + fmt(Math.round(need)) + ' kW ihtiyaç, standart ürün seçimiyle karşılanabilecek ölçeğin üzerinde. Bu büyüklükteki tesisler için kaskad kurgusu, ünite dağılımı ve devreye alma senaryosu projeye özel çalışılır. Formu gönderdiğinizde mühendislik ekibimiz sizinle iletişime geçecektir.']);
    return [];
  }
  var big = series.sizes[series.sizes.length-1];
  var n = Math.ceil(need / big);
  warns.push(['Kaskad sistem','Bu kapasite ' + n + ' adet ' + big + ' kW ünitenin kaskad bağlanmasıyla karşılanır. Yük durumuna göre yalnızca gereken ünite devreye girer, böylece düşük yükte de yüksek verim korunur.']);
  return [{s:series, size:big, qty:n, role:role}];
}

/* ================================================================
   4) ARAYÜZ
   ================================================================ */
var stage = document.getElementById('stage'), rail = document.getElementById('rail'), cur = 0;

function live(){ return PAGES.filter(function(p){ return !p.show || p.show(); }); }
function fmt(n){ return (typeof n === 'number') ? n.toLocaleString('tr-TR') : n; }
function txt(x){ return typeof x === 'function' ? x() : x; }

function paintRail(){
  var L = live(), total = L.length - 2;
  rail.innerHTML = '';
  var idx = L.indexOf(PAGES[cur]);
  rail.style.visibility = (idx <= 0 || L[idx].kind==='done') ? 'hidden' : 'visible';
  for(var i=0;i<total;i++){
    var el = document.createElement('span');
    el.className = i < idx-1 ? 'done' : (i === idx-1 ? 'on' : '');
    rail.appendChild(el);
  }
}

function go(dir){
  var L = live(), i = L.indexOf(PAGES[cur]);
  var t = L[i + dir];
  if(!t) return;
  if(t.kind === 'result') compute();
  cur = PAGES.indexOf(t);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function jumpTo(id){ cur = PAGES.findIndex(function(p){return p.id===id;}); render(); window.scrollTo({top:0}); }

function navHTML(nextLabel, showBack){
  return '<nav><button class="next" id="btnNext">' + nextLabel + '</button>' +
         (showBack !== false ? '<button class="back" id="btnBack">Geri</button>' : '') + '</nav>' +
         '<div class="err" id="err"></div>';
}

function bindNav(onNext){
  var n = document.getElementById('btnNext'), b = document.getElementById('btnBack');
  if(n) n.onclick = onNext;
  if(b) b.onclick = function(){ go(-1); };
}
function showErr(m){ var e = document.getElementById('err'); e.textContent = m; e.classList.add('show'); }

function render(){
  var p = PAGES[cur];
  var L = live(), idx = L.indexOf(p);
  var counter = (idx > 0 && p.kind !== 'result' && p.kind !== 'contact' && p.kind !== 'done')
      ? '<div class="count">Adım ' + idx + ' / ' + (L.length - 3) + '</div>' : '';

  if(p.kind === 'intro'){
    stage.innerHTML =
      '<h1>Isı Pompası Kapasite Simülatörü</h1>' +
      '<p class="lead">Konut, otel, fabrika, mağaza, havuz ve sera projeleri için ısıtma, soğutma ve kullanım sıcak suyu kapasitesini hesaplar; mevcut tesisatınızın yeterliliğini kontrol eder ve size uygun ThermaPlus ürününü önerir.</p>' +
      '<p class="lead" style="margin-bottom:8px">Yaklaşık 3 dakika sürer.</p>' +
      '<p class="lead">Dilerseniz hesaplama sonunda bilgilerinizi teknik ekibimizle paylaşarak teklif alabilirsiniz.</p>' +
      navHTML('Başla', false);
    bindNav(function(){ go(1); });
  }

  else if(p.kind === 'cards' || p.kind === 'multi'){
    var multi = p.kind === 'multi';
    var opts = p.opts();
    var html = counter + '<h2 class="q">' + txt(p.q) + '</h2><p class="hint">' + txt(p.hint) + '</p><div class="cards">';
    opts.forEach(function(o){
      var on = multi ? (A[p.key]||[]).indexOf(o.id) > -1 : A[p.key] === o.id;
      html += '<button type="button" class="card' + (on?' sel':'') + '" data-id="' + o.id + '">' +
              '<b>' + o.v + '</b>' + (o.s ? '<i>' + o.s + '</i>' : '') + '</button>';
    });
    html += '</div>' + navHTML('Devam');
    stage.innerHTML = html;

    stage.querySelectorAll('.card').forEach(function(c){
      c.onclick = function(){
        var id = c.dataset.id;
        if(multi){
          A[p.key] = A[p.key] || [];
          var i = A[p.key].indexOf(id);
          if(i > -1) A[p.key].splice(i,1); else A[p.key].push(id);
          c.classList.toggle('sel');
        } else {
          var match = opts.filter(function(o){ return String(o.id) === id; })[0];
          A[p.key] = match ? match.id : id;
          stage.querySelectorAll('.card').forEach(function(x){x.classList.remove('sel')});
          c.classList.add('sel');
          setTimeout(function(){ go(1); }, 130);
        }
      };
    });
    bindNav(function(){
      if(multi ? !(A[p.key]||[]).length : A[p.key] === undefined)
        return showErr(multi ? 'En az bir seçim yapın.' : 'Bir seçim yapın.');
      go(1);
    });
  }

  else if(p.kind === 'fields'){
    var fs = p.fields();
    var h = counter + '<h2 class="q">' + txt(p.q) + '</h2><p class="hint">' + txt(p.hint) + '</p><div class="grid">';
    fs.forEach(function(f){
      var v = A[f.k] !== undefined ? A[f.k] : f.def;
      h += '<div class="fld"><label for="f_'+f.k+'">'+f.l+'</label>' +
           '<input type="number" id="f_'+f.k+'" value="'+(v===undefined?'':v)+'" ' +
           'min="'+f.min+'" max="'+f.max+'" step="'+(f.step||1)+'" inputmode="decimal">' +
           '<span class="u">'+f.u+'</span></div>';
    });
    h += '</div>' + navHTML('Devam');
    stage.innerHTML = h;
    bindNav(function(){
      for(var i=0;i<fs.length;i++){
        var f = fs[i], el = document.getElementById('f_'+f.k), v = parseFloat(el.value);
        if(isNaN(v)){
          if(p.optional) { A[f.k] = ''; continue; }
          return showErr(f.l + ' alanını doldurun.');
        }
        if(v < f.min || v > f.max) return showErr(f.l + ' için ' + f.min + ' – ' + f.max + ' aralığında bir değer girin.');
        A[f.k] = v;
      }
      go(1);
    });
  }

  else if(p.kind === 'result'){
    var h = '<h1>Hesap sonucunuz</h1><p class="lead">' +
            CFG.types[A.btype].v + ' · ' + CFG.zones[A.zone].v +
            ' · kış tasarım sıcaklığı ' + CFG.zones[A.zone].tw + ' °C</p><div class="figures">';

    if(R.heat !== undefined)
      h += fig('Isıtma kapasitesi', R.heat, 'kW', true);
    if(R.cool !== undefined)
      h += fig('Soğutma kapasitesi', R.cool, 'kW');
    if(R.dhwKW !== undefined)
      h += fig('Kullanım sıcak suyu kapasitesi', R.dhwKW, 'kW · ' + fmt(R.dhwL) + ' L/gün');
    if(R.scop)
      h += fig('Beklenen sezonluk verim (SCOP)', R.scop, '@ ' + R.flowT + ' °C gidiş');
    h += fig('Tahmini yıllık elektrik tüketimi', R.energy, 'kWh / yıl');
    h += '</div>';

    if(R.saving !== undefined && R.saving > 0){
      h += '<div class="pick" style="border-left-color:var(--azure)"><h3>Mevcut sisteminizle karşılaştırma</h3>' +
           '<div class="item"><b>' + R.srcName + ' yerine ısı pompası ile tahmini tasarruf</b>' +
           '<span style="color:var(--flame);font-weight:600;font-size:19px">%' + R.savingPct + '</span></div>' +
           '<p class="hint" style="margin:12px 0 0">Tasarruf oranı tahmini olarak verilmiş olup, mevcut tarifeler, tesisat ve kullanım verilerine bağlı olarak değişebilir.</p></div>';
    }

    if(R.units.length){
    h += '<div class="pick"><h3>Size önerdiğimiz sistem</h3>';
    R.units.forEach(function(u){
      var size = u.unit === 'L' ? u.size + ' L' : u.size + ' kW';
      var qty  = u.qty && u.qty > 1 ? u.qty + ' × ' : '';
      h += '<div class="item"><b>' + qty + u.s.n + ' · ' + size + '</b>' +
           '<span>' + u.role + ' — ' + u.s.d + '</span></div>';
    });
    h += '</div>';
    }

    R.warns.forEach(function(w){
      h += '<div class="warn"><b>' + w[0] + '</b>' + w[1] + '</div>';
    });

    h += '<div class="note">Bu değerler ön boyutlandırmadır. Kesin kapasite seçimi, bina ısı kaybı hesabı ve keşif sonrası mühendislik departmanımızla birlikte netleştirilir.</div>';
    h += navHTML('İletişime Geçilmek İstiyorum');
    stage.innerHTML = h;
    bindNav(function(){ go(1); });
  }

  else if(p.kind === 'contact'){
    stage.innerHTML =
      '<h1>Size nasıl ulaşalım?</h1>' +
      '<p class="lead">Hesabınızı mühendislik ekibimize iletelim, sizinle temasa geçsinler.</p>' +
      '<div class="grid">' +
        fldT('cf','Ad') + fldT('cl','Soyad') +
        fldT('cp','Telefon','tel') + fldT('cc','İl') +
      '</div>' +
      '<div class="fld" style="margin-top:14px"><label for="ce">E-posta</label><input type="email" id="ce" placeholder="ornek@ornek.com"></div>' +
      '<div class="fld" style="margin-top:14px"><label for="cn">İletmek istediğiniz not (isteğe bağlı)</label><textarea id="cn"></textarea></div>' +
      '<nav><button class="send" id="btnSend">Gönder</button><button class="back" id="btnBack">Geri</button></nav>' +
      '<div class="err" id="err"></div>';
    document.getElementById('btnBack').onclick = function(){ go(-1); };
    document.getElementById('btnSend').onclick = send;
  }

  else if(p.kind === 'done'){
    stage.innerHTML =
      '<div class="done-box"><div class="tick">✓</div>' +
      '<h2 id="doneTitle">Teşekkürler, talebiniz alınmıştır</h2>' +
      '<p id="doneText">Bilgileriniz ekibimize iletilmiş olup en kısa sürede sizinle iletişime geçilecektir.</p>' +
      '<button class="again" id="btnAgain">Yeni hesaplama</button></div>';
    document.getElementById('btnAgain').onclick = function(){ location.reload(); };
  }

  paintRail();
}

function fig(name, val, unit, big){
  return '<div class="fig' + (big?' lead-fig':'') + '"><span class="name">' + name + '</span>' +
         '<span class="val">' + fmt(val) + '<u>' + unit + '</u></span></div>';
}
function fldT(id, label, type){
  return '<div class="fld"><label for="'+id+'">'+label+'</label><input type="'+(type||'text')+'" id="'+id+'"></div>';
}

/* ---------------- gönderim ---------------- */
function v(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }

function productLine(){
  return R.units.map(function(u){
    return (u.qty && u.qty>1 ? u.qty+' × ' : '') + u.s.n + ' ' + u.size + (u.unit==='L'?' L':' kW') + ' (' + u.role + ')';
  }).join(' | ');
}

function payloadObj(){
  var t = CFG.types[A.btype], z = CFG.zones[A.zone], o = {};
  o["Ad Soyad"] = v('cf') + ' ' + v('cl');
  o["Telefon"]  = v('cp');
  o["E-posta"]  = v('ce') || '-';
  o["İl"]       = v('cc') || '-';
  o["Not"]      = v('cn') || '-';
  o["Yapı türü"] = t.v;
  o["İklim bölgesi"] = z.v + ' (kış ' + z.tw + ' °C / yaz ' + z.ts + ' °C)';
  if(isBuilding()){
    o["Kullanım amacı"] = A.use.map(function(u){
      return {isitma:'Isıtma',sogutma:'Soğutma',sicaksu:'Sıcak su'}[u]; }).join(', ');
    o["Tesisat durumu"] = A.install === 'mevcut' ? 'Mevcut tesisata entegrasyon' : 'Sıfırdan tesisat';
    o["Alan (m²)"] = A.area;
    o["Kat yüksekliği (m)"] = A.height;
    o["Kat sayısı"] = A.nfloor;
    o["Kişi / yatak sayısı"] = A.people;
    o["Yalıtım"] = CFG.insul[A.insul].v;
    o["Pencere"] = CFG.glass[A.glass].v;
    o["Cephe sayısı"] = CFG.facade[A.facade].v;
    if(A.emit.length) o["Isıtma sistemi"] = A.emit.map(function(k){ return CFG.emitters[k].v; }).join(', ');
    if(A.install === 'mevcut'){
      o["Mevcut gidiş suyu (°C)"] = A.flowT || '-';
      if(A.pipeLen) o["Yerden ısıtma borusu (m)"] = A.pipeLen;
      if(A.radLen)  o["Radyatör uzunluğu (m)"] = A.radLen + ' / yükseklik ' + A.radH + ' m';
      if(R.radCap !== undefined) o["Mevcut radyatör kapasitesi (kW)"] = R.radCap;
      if(R.flrCap !== undefined) o["Mevcut yerden ısıtma kapasitesi (kW)"] = R.flrCap;
    }
    o["Elektrik"] = A.elec === '380' ? '380 V trifaze' : '220 V monofaze';
    if(A.source) o["Mevcut ısıtma kaynağı"] = CFG.sources[A.source].v;
    o["Mevcut sistem yedekte kalsın"] = A.hybrid === 'evet' ? 'Evet' : 'Hayır';
  }
  if(seg()==='havuz'){ o["Su yüzeyi (m²)"] = A.area; o["Derinlik (m)"] = A.depth; o["Havuz tipi"] = CFG.pool[A.pooltype].v; }
  if(seg()==='sera'){ o["Taban alanı (m²)"] = A.area; o["Örtü"] = CFG.cover[A.cover].v; o["Hedef iç sıcaklık (°C)"] = A.seraT; }

  if(R.heat  !== undefined) o["Isıtma kapasitesi (kW)"] = R.heat;
  if(R.cool  !== undefined) o["Soğutma kapasitesi (kW)"] = R.cool;
  if(R.dhwKW !== undefined) o["Sıcak su kapasitesi (kW)"] = R.dhwKW + ' / ' + R.dhwTank + ' L tank';
  if(R.scop) o["SCOP"] = R.scop + ' @ ' + R.flowT + ' °C';
  o["Yıllık tüketim (kWh)"] = R.energy;
  if(R.savingPct !== undefined) o["Tahmini tasarruf oranı"] = '%' + R.savingPct + ' (' + R.srcName + ' ile karşılaştırma)';
  o["Önerilen ürün"] = productLine();
  if(R.warns.length) o["Uyarılar"] = R.warns.map(function(w){ return w[0] + ': ' + w[1]; }).join(' || ');
  return o;
}

function summaryText(){
  var o = payloadObj(), lines = ['ThermaPlus ısı pompası kapasite hesabı',''];
  Object.keys(o).forEach(function(k){ lines.push(k + ': ' + o[k]); });
  lines.push('', 'Tarih: ' + new Date().toLocaleString('tr-TR'));
  return lines.join('\n');
}

function mailtoFallback(){
  window.location.href = 'mailto:' + MAIL_TO +
    '?subject=' + encodeURIComponent('Isı pompası hesabı — ' + v('cf') + ' ' + v('cl')) +
    '&body=' + encodeURIComponent(summaryText());
}

function send(){
  if(!v('cf') || !v('cl') || !v('cp')) return showErr('Ad, soyad ve telefon alanları zorunludur.');
  var btn = document.getElementById('btnSend');
  btn.disabled = true; btn.textContent = 'Gönderiliyor…';

  var p = payloadObj();
  p._subject  = 'Isı pompası hesabı — ' + v('cf') + ' ' + v('cl') + ' · ' + CFG.types[A.btype].v;
  p._template = 'table';

  fetch('https://formsubmit.co/ajax/' + MAIL_TO, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(p)
  })
  .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
  .then(function(){ jumpTo('done'); })
  .catch(function(){
    jumpTo('done');
    document.getElementById('doneTitle').textContent = 'Son bir adım';
    document.getElementById('doneText').textContent =
      'Otomatik gönderim yapılamadı, bilgileriniz posta programınızda hazırlandı. Açılan pencereden Gönder\'e basmanız yeterli.';
    mailtoFallback();
  });
}

render();
</script>
